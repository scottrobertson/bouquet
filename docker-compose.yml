services:
  bouquet:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Required in production. Change these.
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      # Optional. Directory for the database and backups.
      CONFIG_PATH: /data
      SYNC_CRON: ${SYNC_CRON:-0 4 * * *}
    volumes:
      - bouquet-data:/data
    restart: unless-stopped

volumes:
  bouquet-data:
