[package]
name = "bouquet"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
croner = "4"
flate2 = "1"
futures = "0.3"
hex = "0.4"
icu_collator = "2"
mime_guess = "2"
nanoid = "0.5"
object_store = { version = "0.14", features = ["aws"] }
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", features = ["json", "gzip"] }
rusqlite = { version = "0.40", features = ["bundled", "array"] }
async-trait = "0.1"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["compression-gzip"] }
ts-rs = "12"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
lto = "thin"
strip = true
