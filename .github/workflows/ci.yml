name: CI

on:
  push:
  pull_request:

# The image name on GitHub Container Registry.
env:
  IMAGE_NAME: ghcr.io/scottrobertson/bouquet

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Builds the Docker image to make sure it still works. Only pushes on main.
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # Only need to log in when we're going to push.
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest only on main, plus the git sha on every build.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # Build and load into the local docker so we can boot it before pushing.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the built image the same way it's run for real (NODE_ENV is baked
      # into the image, not passed in). The image build runs `npm ci --omit=dev`,
      # so this catches anything only broken at runtime with prod-only deps, like
      # a package server.js imports being in the wrong dependency group.
      - name: Smoke test the image boots
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name smoke \
            -e APP_PASSWORD=ci -e SESSION_SECRET=ci-secret \
            -e CONFIG_PATH=/data "$IMAGE"
          ok=
          for i in $(seq 1 30); do
            if docker logs smoke 2>&1 | grep -q "Bouquet listening"; then ok=1; break; fi
            if [ -z "$(docker ps -q -f name=smoke)" ]; then echo "container exited early"; break; fi
            sleep 1
          done
          echo "--- container logs ---"
          docker logs smoke
          docker rm -f smoke >/dev/null 2>&1 || true
          [ "$ok" = 1 ] || { echo "image did not boot"; exit 1; }

      - if: github.ref == 'refs/heads/main'
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -n1 docker push
